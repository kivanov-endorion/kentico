    <div class="col-12">
        <div class="output" id="output"></div>
    </div>
    </div>
    <script>
        function generateTags() {
  const fields = [
    'geoLocation', 'language', 'platform', 'pageName', 'contentSection',
    'contentType', 'mediaType', 'cta', 'description', 'jobNumber'
  ];

  const values = fields.map(id => {
    const val = document.getElementById(id).value.trim();
    return val ? val.replace(/\s+/g, '_') : null;
  }).filter(Boolean); // Remove nulls (empty fields)

  const campaignTag = values.join('_');

  // For data-name, use only pageName, jobNumber, contentSection, and cta if they exist
  const nameParts = ['pageName', 'jobNumber', 'contentSection', 'cta']
    .map(id => {
      const val = document.getElementById(id).value.trim();
      return val ? val.replace(/\s+/g, '_') : null;
    }).filter(Boolean);

  const nameTag = nameParts.join('_');

  document.getElementById('output').innerHTML = `
    <h5>Generated Tags</h5>
    <p><strong>data-campaign:</strong><br><code>data-campaign="${campaignTag}"</code></p>
    <p><strong>data-name:</strong><br><code>data-name="${nameTag}"</code></p>
  `;
}

    </script>
