<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Upload Button</title>
  <style>
    body {
      background: linear-gradient(to bottom, #2c2c2c, #b0b0b0);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .upload-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .circle-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  border-top: 2px solid rgba(255, 255, 255, 0.4);   /* Light top */
  border-bottom: 2px solid rgba(255, 255, 255, 0.4);/* Light bottom */
  border-left: 1px solid rgba(0, 0, 0, 0.3);        /* Dark left */
  border-right: 1px solid rgba(0, 0, 0, 0.3);       /* Dark right */
  display: flex;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(6px);
  cursor: pointer;
  transition: background 0.3s ease;
}

.upload-label {
  padding: 10px 20px;
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.1);
  border-top: 2px solid rgba(255, 255, 255, 0.6);
  border-bottom: 2px solid rgba(255, 255, 255, 0.6);
  border-left: 1px solid rgba(0, 0, 0, 0.3);
  border-right: 1px solid rgba(0, 0, 0, 0.3);
  color: white;
  font-size: 16px;
  backdrop-filter: blur(6px);
  cursor: pointer;
  transition: background 0.3s ease;
}


    .circle-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .circle-btn svg {
      width: 20px;
      height: 20px;
      fill: white;
    }


    .upload-label:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="upload-container">
    <div class="circle-btn">
      <!-- Upward arrow icon -->
      <svg viewBox="0 0 24 24">
        <path d="M12 2L6 8h4v8h4V8h4z"/>
      </svg>
    </div>
    <div class="upload-label">Upload</div>
  </div>
</body>
</html>
