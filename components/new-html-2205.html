<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        details::details-content {
  transition: opacity 0.3s ease;
  opacity: 1;
}
/* Light styling for presentation */
details {
  border-block-end: 1px solid #000;
  margin-block: .5rem;
  padding-block: .5rem;
}

summary {
  /* Pin the custom marker to the container */
  position: relative;
  /* Register summary as an anchor element */
  anchor-name: --summary;
  
  &::marker {
    content: "";
  }
  
  &::before,
  &::after {
    /* Custom marker dimensions */
    content: "";
    border-block-start: 3px solid orangered;
    height: 0;
    width: 1rem;
    
    /* Positions the lines */
    inset-block-start: 50%;
    inset-inline-end: 0;
    
    /* Anchor the shape to the summary */
    position: absolute;
    position-anchor: --summary;
    position-area: top end;
  }
  
  /* Rotate just the ::after line to create a "+"" shape */
  &::after {
    transform: rotate(90deg);
    transform-origin: 50%;
  }
}

/* Rotate the line when open */
details[open] summary::after {
  transform: rotate(0deg);
}
    </style>
</head>
<body>
    <details name="faq"><summary>What is HTML?</summary>
  <p>HTML stands for HyperText Markup Language.</p>
</details>
<details name="faq"><summary>What is CSS?</summary>
  <p>CSS stands for Cascading Style Sheets. <a href="/about" data-view-transition="fade">About Us</a>
</p>
</details>


<dialog open>
  <p>This is a modal dialog.</p>
  <button onclick="this.closest('dialog').close()">Close</button>
</dialog>

</body>
</html>
